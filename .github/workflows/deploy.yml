name: Deploy to OVH

on:
  push:
    branches:
      - master

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # Checkout the code
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v2
        with:
          node-version: '22'

      # Install dependencies and build
      - name: Install dependencies
        run: npm install

      - name: Install LaTeX toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends make texlive texlive-latex-extra texlive-fonts-extra texlive-fonts-recommended latexmk
          sudo rm -rf /var/lib/apt/lists/*

      - name: Build CV PDF
        run: make cv

      - name: Build project
        run: PUBLIC_USE_LOCAL_OLLAMA=0 PUBLIC_HF_INFERENCE_TOKEN=${{ secrets.HF_INFERENCE_TOKEN }} npm run build

      # Deploy via SFTP
      - name: Deploy via SFTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          local-dir: build/ # Local directory containing the files to deploy (adjust as needed)
          server-dir: /www/ # Remote directory on your OVH server
          server: ${{ secrets.SFTP_HOST }}
          username: ${{ secrets.SFTP_USER }}
          password: ${{ secrets.SFTP_PASSWORD }}
